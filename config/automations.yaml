- id: 'frigate_detection_notification'
  alias: 'Camera AI - Thông báo phát hiện đối tượng về điện thoại'
  description: 'Gửi thông báo có snapshot và nút bấm về điện thoại Pixel khi có Người hoặc Con vật. Sân Trước/Sau/Ban công báo Người 24/7. Cổng/Khách/Bếp chỉ báo Người ban đêm (23h-5h). Chó/Mèo gộp thành Con vật.'
  trigger:
    - platform: mqtt
      topic: frigate/events
  condition:
    - condition: template
      value_template: >-
        {{ trigger.payload_json.after.has_snapshot == true }}
    - condition: template
      value_template: >-
        {{ (trigger.payload_json.type == 'new' and trigger.payload_json.after.has_snapshot) or 
           (trigger.payload_json.before.has_snapshot == false and trigger.payload_json.after.has_snapshot == true) }}
    - condition: template
      value_template: >-
        {% set cam = trigger.payload_json.after.camera %}
        {% set lbl = trigger.payload_json.after.label %}
        {% set is_night = now().hour >= 23 or now().hour < 5 %}
        {% set has_person = is_state('binary_sensor.' ~ cam ~ '_person_occupancy', 'on') %}
        {% if cam in ['san_truoc', 'san_sau', 'ban_cong'] %}
          {% if lbl in ['dog', 'cat'] %}
            {{ not has_person }}
          {% else %}
            {{ lbl == 'person' }}
          {% endif %}
        {% elif cam in ['cong', 'phong_khach', 'bep'] %}
          {% if lbl in ['dog', 'cat'] %}
            {{ not has_person }}
          {% elif lbl == 'person' %}
            {{ is_night }}
          {% else %}
            {{ false }}
          {% endif %}
        {% else %}
          {{ false }}
        {% endif %}
  action:
    - variables:
        event_id: "{{ trigger.payload_json.after.id }}"
        camera: "{{ trigger.payload_json.after.camera }}"
        label: "{{ trigger.payload_json.after.label }}"
        camera_map:
          phong_khach: "Phòng Khách"
          san_truoc: "Sân Trước"
          san_sau: "Sân Sau"
          cong: "Cổng"
          bep: "Nhà Bếp"
          ban_cong: "Ban Công"
        label_map:
          person: "Người 🚶"
          car: "Ô tô 🚗"
          motorcycle: "Xe máy 🏍️"
          bicycle: "Xe đạp 🚲"
          dog: "Con vật 🐾"
          cat: "Con vật 🐾"
        cam_name: "{{ camera_map.get(camera, camera) }}"
        lbl_name: "{{ label_map.get(label, label) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ camera in ['cong', 'san_truoc'] }}"
          sequence:
            - service: notify.mobile_app_pixel_10_pro_xl
              data:
                title: "🔔 Phát hiện {{ lbl_name }} tại {{ cam_name }}"
                message: "Thời gian: {{ now().strftime('%H:%M:%S') }}"
                data:
                  tag: "{{ event_id }}"
                  alert_once: true
                  image: "/api/frigate/notifications/{{ event_id }}/snapshot.jpg"
                  clickAction: "/frigate-nvr"
                  channel: "Camera_Alerts"
                  actions:
                    - action: "URI"
                      title: "Xem clip"
                      uri: "/api/frigate/notifications/{{ event_id }}/clip.mp4"
                    - action: "TOGGLE_MAIN_GATE"
                      title: "Mở/Đóng cổng"
                    - action: "TOGGLE_SUB_GATE"
                      title: "Mở 1 cánh"
      default:
        - service: notify.mobile_app_pixel_10_pro_xl
          data:
            title: "🔔 Phát hiện {{ lbl_name }} tại {{ cam_name }}"
            message: "Thời gian: {{ now().strftime('%H:%M:%S') }}"
            data:
              tag: "{{ event_id }}"
              alert_once: true
              image: "/api/frigate/notifications/{{ event_id }}/snapshot.jpg"
              clickAction: "/frigate-nvr"
              channel: "Camera_Alerts"
              actions:
                - action: "URI"
                  title: "Xem clip"
                  uri: "/api/frigate/notifications/{{ event_id }}/clip.mp4"
                - action: "URI"
                  title: "Trực tiếp"
                  uri: "/frigate-nvr"
  mode: parallel
  max: 10

- id: 'frigate_notification_action_toggle_main_gate'
  alias: 'Camera AI - Mở hoặc Đóng toàn bộ cổng từ thông báo'
  description: 'Kích hoạt công tắc cổng Tuya switch.cong_switch_switch_1 khi nhấn nút Mở/Đóng cổng'
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: TOGGLE_MAIN_GATE
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.cong_switch_switch_1
    - delay:
        seconds: 1
    - service: switch.turn_off
      target:
        entity_id: switch.cong_switch_switch_1
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        message: "Đã kích hoạt: Mở/Đóng toàn bộ cổng qua Tuya"
        data:
          tag: "gate_status"
  mode: single

- id: 'frigate_notification_action_toggle_sub_gate'
  alias: 'Camera AI - Mở 1 cánh cổng từ thông báo'
  description: 'Kích hoạt scene mở 1 cánh cổng Tuya scene.mo_1_cong khi nhấn nút Mở 1 cánh'
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: TOGGLE_SUB_GATE
  action:
    - service: scene.turn_on
      target:
        entity_id: scene.mo_1_cong
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        message: "Đã kích hoạt: Mở 1 cánh cổng (Cổng phụ) qua Tuya"
        data:
          tag: "gate_status"
  mode: single

- id: 'smart_presence_lighting_turn_on'
  alias: 'Đèn Thông Minh AI - Tự động Bật Đèn khi có Người'
  description: 'Tự động bật đèn khi có người: Cổng, Sân Trước, Phòng Khách chỉ bật sau hoàng hôn/ban đêm; Nhà Bếp, Sân Sau, Ban Công bật cả ngày lẫn đêm.'
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.san_truoc_person_occupancy
        - binary_sensor.gate_sensor_door
        - binary_sensor.door_sensor_living_door
        - binary_sensor.door_sensor_office_door
        - binary_sensor.san_sau_person_occupancy
        - binary_sensor.phong_khach_person_occupancy
        - binary_sensor.khu_vuc_phong_khach_person_occupancy
        - binary_sensor.khu_vuc_bep_person_occupancy
        - binary_sensor.ban_cong_person_occupancy
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.smart_lighting_enabled
      state: 'on'
  action:
    - choose:
        # Sân Trước: Mở hết cả 3 đèn sau hoàng hôn / ban đêm khi có Người hoặc khi Cổng Mở
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id in ['binary_sensor.san_truoc_person_occupancy', 'binary_sensor.gate_sensor_door'] }}"
            - condition: template
              value_template: >-
                {{ is_state('sun.sun', 'below_horizon') or now().hour >= 18 or now().hour < 6 }}
          sequence:
            - service: switch.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - switch.san_truoc_switch_1
                  - switch.san_truoc_switch_2
                  - switch.san_truoc_switch_3

        # Phòng Khách: Mở quạt 24/7 khi thấy người hoặc Cửa Chính mở; Mở hết cả 3 đèn sau hoàng hôn / ban đêm
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id in ['binary_sensor.phong_khach_person_occupancy', 'binary_sensor.khu_vuc_phong_khach_person_occupancy', 'binary_sensor.door_sensor_living_door'] }}"
          sequence:
            - service: switch.turn_on
              continue_on_error: true
              target:
                entity_id: switch.phong_khach_switch_4
            - if:
                - condition: template
                  value_template: >-
                    {{ is_state('sun.sun', 'below_horizon') or now().hour >= 18 or now().hour < 6 }}
              then:
                - service: switch.turn_on
                  continue_on_error: true
                  target:
                    entity_id:
                      - switch.phong_khach_switch_1
                      - switch.phong_khach_switch_2
                      - switch.phong_khach_switch_3

        # Nhà Bếp: Chỉ bật cả 2 đèn sau hoàng hôn / ban đêm (18h - 6h), ban ngày buổi sáng không bật
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'binary_sensor.khu_vuc_bep_person_occupancy' }}"
            - condition: template
              value_template: >-
                {{ is_state('sun.sun', 'below_horizon') or now().hour >= 18 or now().hour < 6 }}
          sequence:
            - service: switch.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - switch.nha_bep_switch_2
                  - switch.nha_bep_switch_3

        # Sân Sau: BẬT CÔNG TẮC 1 NHÀ BẾP (Đèn sân sau) CHỈ KHI CÓ NGƯỜI
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'binary_sensor.san_sau_person_occupancy' }}"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.nha_bep_switch_1

        # Ban Công: Bật cả 2 đèn khi có Người hoặc khi Cửa Ban Công mở sau hoàng hôn / ban đêm
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id in ['binary_sensor.ban_cong_person_occupancy', 'binary_sensor.door_sensor_office_door'] }}"
            - condition: template
              value_template: >-
                {{ is_state('sun.sun', 'below_horizon') or now().hour >= 18 or now().hour < 6 }}
          sequence:
            - service: switch.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - switch.ban_cong_switch_1
                  - switch.ban_cong_switch_2
  mode: parallel
  max: 10

- id: 'smart_presence_lighting_turn_off'
  alias: 'Đèn Thông Minh AI - Tự động Tắt Đèn khi Người rời đi'
  description: 'Tự động tắt đèn sau khi không còn người trong khu vực'
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.san_truoc_person_occupancy
        - binary_sensor.san_sau_person_occupancy
        - binary_sensor.ban_cong_person_occupancy
      to: 'off'
      for:
        minutes: 2
    - platform: state
      entity_id:
        - binary_sensor.phong_khach_person_occupancy
        - binary_sensor.khu_vuc_phong_khach_person_occupancy
        - binary_sensor.khu_vuc_bep_person_occupancy
      to: 'off'
      for:
        minutes: 5
  condition:
    - condition: state
      entity_id: input_boolean.smart_lighting_enabled
      state: 'on'
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'binary_sensor.san_truoc_person_occupancy' }}"
          sequence:
            - service: switch.turn_off
              continue_on_error: true
              target:
                entity_id:
                  - switch.san_truoc_switch_1
                  - switch.san_truoc_switch_2
                  - switch.san_truoc_switch_3

        # Sân Sau: Người rời đi (sau 2 phút) thì tắt đèn
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'binary_sensor.san_sau_person_occupancy' }}"
          sequence:
            - service: switch.turn_off
              continue_on_error: true
              target:
                entity_id: switch.nha_bep_switch_1
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id in ['binary_sensor.phong_khach_person_occupancy', 'binary_sensor.khu_vuc_phong_khach_person_occupancy'] }}"
            - condition: state
              entity_id: binary_sensor.phong_khach_person_occupancy
              state: 'off'
            - condition: state
              entity_id: binary_sensor.khu_vuc_phong_khach_person_occupancy
              state: 'off'
          sequence:
            - service: switch.turn_off
              continue_on_error: true
              target:
                entity_id:
                  - switch.phong_khach_switch_1
                  - switch.phong_khach_switch_2
                  - switch.phong_khach_switch_3
                  - switch.phong_khach_switch_4
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'binary_sensor.khu_vuc_bep_person_occupancy' }}"
          sequence:
            - service: switch.turn_off
              continue_on_error: true
              target:
                entity_id:
                  - switch.nha_bep_switch_2
                  - switch.nha_bep_switch_3
        - conditions:
            - condition: template
              value_template: "{{ trigger.entity_id == 'binary_sensor.ban_cong_person_occupancy' }}"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.ban_cong_switch_1
  mode: parallel
  max: 10

# ─────────────────────────────────────────────────────────────────────────────
# NHÓM 1 & NHÓM 4: CẢNH BÁO CỔNG MỞ KÈM ẢNH 2 CAMERA (CỔNG + SÂN TRƯỚC) & AI
# ─────────────────────────────────────────────────────────────────────────────
- id: 'gate_sensor_opened_alert'
  alias: 'Cửa Cổng - Cảnh báo Cổng Mở kèm Ảnh Cổng & Sân Trước'
  description: 'Khi cửa cổng mở: chụp ảnh 2 camera (Cổng & Sân Trước), phân tích đối tượng Frigate AI và gửi thông báo thông minh về điện thoại'
  trigger:
    - platform: state
      entity_id: binary_sensor.gate_sensor_door
      to: 'on'
  action:
    # 1. Chụp ảnh snapshot tức thì từ 2 camera Cổng và Sân Trước
    - service: shell_command.save_gate_snapshots
      continue_on_error: true
    - delay:
        milliseconds: 300

    # 2. Chuẩn bị thông tin nhận diện đối tượng và trạng thái nhà
    - variables:
        is_away: >-
          {{ not is_state('person.nho_tin', 'home') and not is_state('person.hong_ngan', 'home') }}
        is_night: >-
          {{ now().hour >= 23 or now().hour < 5 }}
        ai_summary: >-
          {% set items = [] %}
          {% if is_state('binary_sensor.cong_person_occupancy', 'on') or is_state('binary_sensor.san_truoc_person_occupancy', 'on') %}
            {% set items = items + ['Người'] %}
          {% endif %}
          {% if is_state('binary_sensor.cong_motorcycle_occupancy', 'on') or is_state('binary_sensor.san_truoc_motorcycle_occupancy', 'on') %}
            {% set items = items + ['Xe máy'] %}
          {% endif %}
          {% if is_state('binary_sensor.cong_car_occupancy', 'on') or is_state('binary_sensor.san_truoc_car_occupancy', 'on') %}
            {% set items = items + ['Ô tô'] %}
          {% endif %}
          {% if items | length > 0 %}
            Phát hiện: {{ items | join(', ') }}
          {% else %}
            Chưa phát hiện người/xe trong tầm quét
          {% endif %}

    # 3. Gửi thông báo chính kèm ảnh Camera Cổng
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        title: >-
          {% if is_away %}
            🚨 CẢNH BÁO: CỔNG MỞ KHI VẮNG NHÀ!
          {% elif is_night %}
            🌙 CẢNH BÁO: CỔNG MỞ BAN ĐÊM ({{ now().strftime('%H:%M:%S') }})
          {% else %}
            🚪 CỔNG VỪA MỞ ({{ now().strftime('%H:%M:%S') }})
          {% endif %}
        message: >-
          {% if is_away %}
            ⚠️ Phát hiện cổng mở trong khi không có ai ở nhà! AI {{ ai_summary }}.
          {% elif is_night %}
            Cổng mở vào khung giờ khuya. AI {{ ai_summary }}.
          {% else %}
            Cổng vừa mở lúc {{ now().strftime('%H:%M:%S') }}. AI {{ ai_summary }}.
          {% endif %}
        data:
          image: "/local/snapshots/cong_latest.jpg?v={{ now().timestamp() }}"
          group: "gate_event"
          tag: "gate_status_cong"
          channel: >-
            {{ 'alarm_stream' if (is_away or is_night) else 'Gate_Alerts' }}
          importance: >-
            {{ 'high' if (is_away or is_night) else 'default' }}
          clickAction: "/frigate-nvr"
          actions:
            - action: "CLOSE_GATE"
              title: "🔒 Đóng cổng ngay"
            - action: "TOGGLE_SUB_GATE"
              title: "🚪 Mở 1 cánh"
            - action: "TRIGGER_SIREN"
              title: "🚨 Hú còi báo động"

    # 4. Gửi thông báo kèm ảnh Camera Sân Trước (gom chung nhóm gate_event)
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        title: "📸 Góc nhìn Sân Trước"
        message: "Ảnh chụp sân trước lúc {{ now().strftime('%H:%M:%S') }}"
        data:
          image: "/local/snapshots/san_truoc_latest.jpg?v={{ now().timestamp() }}"
          group: "gate_event"
          tag: "gate_status_san_truoc"
          clickAction: "/frigate-nvr"
  mode: single

# ─────────────────────────────────────────────────────────────────────────────
# AN NINH CỬA BAN CÔNG: CẢNH BÁO MỞ CỬA KÈM ẢNH CAMERA BAN CÔNG & AI
# ─────────────────────────────────────────────────────────────────────────────
- id: 'balcony_door_opened_alert'
  alias: 'Cửa Ban Công - Cảnh báo Cửa Mở kèm Ảnh Camera Ban Công'
  description: 'Khi cửa ban công mở: chụp ảnh camera ban công tức thì, phân tích người AI và gửi cảnh báo an ninh về điện thoại'
  trigger:
    - platform: state
      entity_id: binary_sensor.door_sensor_office_door
      to: 'on'
  action:
    # 1. Chụp ảnh snapshot camera ban công
    - service: shell_command.save_balcony_snapshot
      continue_on_error: true
    - delay:
        milliseconds: 300

    # 2. Phân tích trạng thái vắng nhà, ban đêm và AI Frigate
    - variables:
        is_away: >-
          {{ not is_state('person.nho_tin', 'home') and not is_state('person.hong_ngan', 'home') }}
        is_night: >-
          {{ now().hour >= 23 or now().hour < 5 }}
        has_person: >-
          {{ is_state('binary_sensor.ban_cong_person_occupancy', 'on') }}

    # 3. Gửi thông báo an ninh kèm ảnh
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        title: >-
          {% if is_away %}
            🚨 CẢNH BÁO ĐỘT NHẬP: CỬA BAN CÔNG MỞ KHI VẮNG NHÀ!
          {% elif is_night %}
            🌙 CẢNH BÁO: CỬA BAN CÔNG MỞ BAN ĐÊM ({{ now().strftime('%H:%M:%S') }})
          {% else %}
            🚪 CỬA BAN CÔNG VỪA MỞ ({{ now().strftime('%H:%M:%S') }})
          {% endif %}
        message: >-
          {% if is_away %}
            ⚠️ Phát hiện cửa ra ban công bị mở khi không có ai ở nhà! AI {{ 'phát hiện Người trên ban công' if has_person else 'chưa thấy người' }}.
          {% elif is_night %}
            Cửa ban công mở vào khung giờ khuya. AI {{ 'phát hiện Người trên ban công' if has_person else 'chưa thấy người' }}.
          {% else %}
            Cửa ra ban công vừa mở lúc {{ now().strftime('%H:%M:%S') }}.
          {% endif %}
        data:
          image: "/local/snapshots/ban_cong_latest.jpg?v={{ now().timestamp() }}"
          group: "door_event"
          tag: "door_status_balcony"
          channel: >-
            {{ 'alarm_stream' if (is_away or is_night) else 'Door_Alerts' }}
          importance: >-
            {{ 'high' if (is_away or is_night) else 'default' }}
          clickAction: "/frigate-nvr"
          actions:
            - action: "TRIGGER_SIREN"
              title: "🚨 Hú còi báo động"
            - action: "TURN_ON_BALCONY_LIGHTS"
              title: "💡 Bật sáng đèn ban công"
  mode: single

# ─────────────────────────────────────────────────────────────────────────────
# AN NINH CỬA CHÍNH: CẢNH BÁO MỞ CỬA KÈM ẢNH PHÒNG KHÁCH & SÂN TRƯỚC
# ─────────────────────────────────────────────────────────────────────────────
- id: 'living_door_opened_alert'
  alias: 'Cửa Chính - Cảnh báo Cửa Chính Mở kèm Ảnh Camera'
  description: 'Khi cửa chính phòng khách mở: chụp ảnh phòng khách và sân trước, gửi cảnh báo an ninh về điện thoại. Nếu vắng nhà: tự động hú còi báo động.'
  trigger:
    - platform: state
      entity_id: binary_sensor.door_sensor_living_door
      to: 'on'
  action:
    # 1. Chụp ảnh snapshot phòng khách & sân trước
    - service: shell_command.save_living_door_snapshots
      continue_on_error: true
    - delay:
        milliseconds: 300

    # 2. Phân tích trạng thái vắng nhà, ban đêm
    - variables:
        is_away: >-
          {{ not is_state('person.nho_tin', 'home') and not is_state('person.hong_ngan', 'home') }}
        is_night: >-
          {{ now().hour >= 23 or now().hour < 5 }}
        has_person: >-
          {{ is_state('binary_sensor.phong_khach_person_occupancy', 'on') or is_state('binary_sensor.san_truoc_person_occupancy', 'on') }}

    # 3. Nếu vắng nhà: TỰ ĐỘNG HÚ CÒI BÁO ĐỘNG NGAY LẬP TỨC
    - if:
        - condition: template
          value_template: "{{ is_away }}"
      then:
        - service: siren.turn_on
          continue_on_error: true
          target:
            entity_id:
              - siren.camera_san_siren
              - siren.camera_phong_khach_siren

    # 4. Gửi thông báo an ninh kèm ảnh Camera Phòng Khách
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        title: >-
          {% if is_away %}
            🚨 BÁO ĐỘNG ĐỘT NHẬP: CỬA CHÍNH MỞ KHI VẮNG NHÀ!
          {% elif is_night %}
            🌙 CẢNH BÁO: CỬA CHÍNH MỞ BAN ĐÊM ({{ now().strftime('%H:%M:%S') }})
          {% else %}
            🚪 CỬA CHÍNH VỪA MỞ ({{ now().strftime('%H:%M:%S') }})
          {% endif %}
        message: >-
          {% if is_away %}
            ⚠️ Phát hiện cửa chính bị mở khi không có ai ở nhà! Còi báo động đã tự động kích hoạt. AI {{ 'phát hiện có Người' if has_person else 'chưa thấy người' }}.
          {% elif is_night %}
            Cửa chính mở vào khung giờ khuya. AI {{ 'phát hiện có Người' if has_person else 'chưa thấy người' }}.
          {% else %}
            Cửa chính phòng khách vừa mở lúc {{ now().strftime('%H:%M:%S') }}.
          {% endif %}
        data:
          image: "/local/snapshots/phong_khach_latest.jpg?v={{ now().timestamp() }}"
          group: "door_event"
          tag: "door_status_living"
          channel: >-
            {{ 'alarm_stream' if (is_away or is_night) else 'Door_Alerts' }}
          importance: >-
            {{ 'high' if (is_away or is_night) else 'default' }}
          clickAction: "/frigate-nvr"
          actions:
            - action: "TRIGGER_SIREN"
              title: "🚨 Hú còi báo động"
            - action: "CLOSE_GATE"
              title: "🔒 Đóng cổng nếu mở"
  mode: single

# ─────────────────────────────────────────────────────────────────────────────
# CHỐNG LEO RÀO: PHÁT HIỆN NGƯỜI SÂN TRƯỚC KHI CỔNG ĐANG ĐÓNG KÍN
# ─────────────────────────────────────────────────────────────────────────────
- id: 'san_truoc_fence_jump_intrusion_alert'
  alias: 'Sân Trước - Cảnh báo Nghi vấn Leo Rào Đột Nhập (Cổng Đóng)'
  description: 'Khi phát hiện có Người ở Sân Trước vào ban đêm hoặc khi vắng nhà mà Cửa Cổng vẫn đang đóng kín (dấu hiệu leo rào)'
  trigger:
    - platform: state
      entity_id: binary_sensor.san_truoc_person_occupancy
      to: 'on'
  condition:
    # Cổng chính vẫn đang đóng kín
    - condition: state
      entity_id: binary_sensor.gate_sensor_door
      state: 'off'
    # Xảy ra khi Vắng nhà HOẶC Ban đêm (23h - 5h)
    - condition: template
      value_template: >-
        {{ (not is_state('person.nho_tin', 'home') and not is_state('person.hong_ngan', 'home')) or (now().hour >= 23 or now().hour < 5) }}
  action:
    # 1. Bật ngay sáng trưng toàn bộ 3 đèn Sân Trước để đuổi kẻ gian
    - service: switch.turn_on
      continue_on_error: true
      target:
        entity_id:
          - switch.san_truoc_switch_1
          - switch.san_truoc_switch_2
          - switch.san_truoc_switch_3

    # 2. Chụp ảnh snapshot góc Cổng & Sân Trước
    - service: shell_command.save_gate_snapshots
      continue_on_error: true
    - delay:
        milliseconds: 300

    - variables:
        is_away: >-
          {{ not is_state('person.nho_tin', 'home') and not is_state('person.hong_ngan', 'home') }}

    # 3. Gửi thông báo khẩn cấp (Critical Alert) về điện thoại
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        title: >-
          {% if is_away %}
            🚨 BÁO ĐỘNG ĐỘT NHẬP: NGHI VẤN LEO RÀO VÀO SÂN (CỔNG ĐÓNG)!
          {% else %}
            🌙 CẢNH BÁO KHẨN: CÓ NGƯỜI Ở SÂN TRƯỚC BAN ĐÊM (CỔNG ĐÓNG)!
          {% endif %}
        message: >-
          Cổng chính đang đóng kín nhưng AI phát hiện có Người xuất hiện ở Sân Trước lúc {{ now().strftime('%H:%M:%S') }}. Đèn sân đã tự động bật sáng rực rỡ!
        data:
          image: "/local/snapshots/san_truoc_latest.jpg?v={{ now().timestamp() }}"
          group: "intrusion_event"
          tag: "fence_jump_alert"
          channel: "alarm_stream"
          importance: "high"
          clickAction: "/frigate-nvr"
          actions:
            - action: "TRIGGER_SIREN"
              title: "🚨 Hú còi báo động ngay"
            - action: "TURN_ON_LIVING_LIGHTS"
              title: "💡 Bật sáng đèn phòng khách"
  mode: single

# ─────────────────────────────────────────────────────────────────────────────
# NHÓM 2: CẢNH BÁO CỔNG, CỬA CHÍNH HOẶC CỬA BAN CÔNG MỞ QUÁ LÂU (NGÀY & ĐÊM)
# ─────────────────────────────────────────────────────────────────────────────
- id: 'door_opened_too_long_alert'
  alias: 'Cảm Biến Cửa - Cảnh báo Cổng, Cửa Chính hoặc Cửa Ban Công mở quá lâu'
  description: 'Cảnh báo khi cổng, cửa chính hoặc cửa ban công mở quá 5 phút (ban ngày) hoặc quá 2 phút (ban đêm)'
  trigger:
    # Cổng mở
    - platform: state
      entity_id: binary_sensor.gate_sensor_door
      to: 'on'
      for:
        minutes: 5
      id: 'gate_day_5m'
    - platform: state
      entity_id: binary_sensor.gate_sensor_door
      to: 'on'
      for:
        minutes: 2
      id: 'gate_night_2m'
    # Cửa chính mở
    - platform: state
      entity_id: binary_sensor.door_sensor_living_door
      to: 'on'
      for:
        minutes: 5
      id: 'living_day_5m'
    - platform: state
      entity_id: binary_sensor.door_sensor_living_door
      to: 'on'
      for:
        minutes: 2
      id: 'living_night_2m'
    # Cửa ban công mở
    - platform: state
      entity_id: binary_sensor.door_sensor_office_door
      to: 'on'
      for:
        minutes: 5
      id: 'balcony_day_5m'
    - platform: state
      entity_id: binary_sensor.door_sensor_office_door
      to: 'on'
      for:
        minutes: 2
      id: 'balcony_night_2m'
  action:
    - choose:
        # Cổng mở quá lâu
        - conditions:
            - condition: template
              value_template: "{{ trigger.id in ['gate_day_5m', 'gate_night_2m'] }}"
            - condition: template
              value_template: >-
                {{ trigger.id == 'gate_day_5m' or (now().hour >= 22 or now().hour < 6) }}
          sequence:
            - service: shell_command.save_gate_snapshots
              continue_on_error: true
            - delay:
                milliseconds: 300
            - service: notify.mobile_app_pixel_10_pro_xl
              data:
                title: "⚠️ CẢNH BÁO: CỔNG ĐANG MỞ QUÁ LÂU!"
                message: >-
                  Cổng đã mở liên tục {{ 'hơn 2 phút (ban đêm)' if trigger.id == 'gate_night_2m' else 'hơn 5 phút' }}. Hãy kiểm tra đóng cổng để đảm bảo an toàn.
                data:
                  image: "/local/snapshots/cong_latest.jpg?v={{ now().timestamp() }}"
                  tag: "gate_opened_too_long"
                  group: "door_warning"
                  channel: "alarm_stream"
                  importance: "high"
                  clickAction: "/frigate-nvr"
                  actions:
                    - action: "CLOSE_GATE"
                      title: "🔒 Đóng cổng ngay"

        # Cửa chính mở quá lâu
        - conditions:
            - condition: template
              value_template: "{{ trigger.id in ['living_day_5m', 'living_night_2m'] }}"
            - condition: template
              value_template: >-
                {{ trigger.id == 'living_day_5m' or (now().hour >= 22 or now().hour < 6) }}
          sequence:
            - service: shell_command.save_living_door_snapshots
              continue_on_error: true
            - delay:
                milliseconds: 300
            - service: notify.mobile_app_pixel_10_pro_xl
              data:
                title: "⚠️ CẢNH BÁO: CỬA CHÍNH ĐANG MỞ QUÁ LÂU!"
                message: >-
                  Cửa chính phòng khách đang mở liên tục {{ 'hơn 2 phút (ban đêm)' if trigger.id == 'living_night_2m' else 'hơn 5 phút' }}. Hãy kiểm tra khép cửa để đảm bảo an ninh!
                data:
                  image: "/local/snapshots/phong_khach_latest.jpg?v={{ now().timestamp() }}"
                  tag: "living_door_opened_too_long"
                  group: "door_warning"
                  channel: "alarm_stream"
                  importance: "high"
                  clickAction: "/frigate-nvr"

        # Cửa ban công mở quá lâu
        - conditions:
            - condition: template
              value_template: "{{ trigger.id in ['balcony_day_5m', 'balcony_night_2m'] }}"
            - condition: template
              value_template: >-
                {{ trigger.id == 'balcony_day_5m' or (now().hour >= 22 or now().hour < 6) }}
          sequence:
            - service: shell_command.save_balcony_snapshot
              continue_on_error: true
            - delay:
                milliseconds: 300
            - service: notify.mobile_app_pixel_10_pro_xl
              data:
                title: "⚠️ CẢNH BÁO: CỬA BAN CÔNG ĐANG MỞ QUÁ LÂU!"
                message: >-
                  Cửa ra ban công đang mở liên tục {{ 'hơn 2 phút (ban đêm)' if trigger.id == 'balcony_night_2m' else 'hơn 5 phút' }}. Hãy kiểm tra khép cửa để tránh bụi, mưa và thoát nhiệt máy lạnh.
                data:
                  image: "/local/snapshots/ban_cong_latest.jpg?v={{ now().timestamp() }}"
                  tag: "balcony_door_opened_too_long"
                  group: "door_warning"
                  channel: >-
                    {{ 'alarm_stream' if trigger.id == 'balcony_night_2m' else 'General_Alerts' }}
                  importance: >-
                    {{ 'high' if trigger.id == 'balcony_night_2m' else 'default' }}
                  clickAction: "/frigate-nvr"
                  actions:
                    - action: "TURN_ON_BALCONY_LIGHTS"
                      title: "💡 Bật đèn ban công"
  mode: parallel
  max: 5

# ─────────────────────────────────────────────────────────────────────────────
# NÚT HÀNH ĐỘNG THÔNG BÁO: ĐÓNG CỔNG & HÚ CÒI BÁO ĐỘNG
# ─────────────────────────────────────────────────────────────────────────────
- id: 'gate_notification_action_close_gate'
  alias: 'Cửa Cổng - Đóng cổng từ thông báo'
  description: 'Kích hoạt scene đóng cổng Tuya khi nhấn nút Đóng cổng trên thông báo'
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: CLOSE_GATE
  action:
    - service: scene.turn_on
      continue_on_error: true
      target:
        entity_id: scene.dong_cong
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        message: "Đã gửi lệnh ĐÓNG CỔNG qua Tuya"
        data:
          tag: "gate_status"
  mode: single

- id: 'gate_notification_action_trigger_siren'
  alias: 'An Ninh - Hú còi báo động từ thông báo'
  description: 'Hú còi camera sân và camera phòng khách trong 15 giây khi người dùng bấm Hú còi báo động từ thông báo'
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: TRIGGER_SIREN
  action:
    - service: siren.turn_on
      continue_on_error: true
      target:
        entity_id:
          - siren.camera_san_siren
          - siren.camera_phong_khach_siren
    - delay:
        seconds: 15
    - service: siren.turn_off
      continue_on_error: true
      target:
        entity_id:
          - siren.camera_san_siren
          - siren.camera_phong_khach_siren
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        message: "Đã tắt còi báo động sau 15 giây"
        data:
          tag: "siren_status"
  mode: single

- id: 'balcony_notification_action_turn_on_lights'
  alias: 'Ban Công - Bật sáng đèn ban công từ thông báo'
  description: 'Bật toàn bộ đèn ban công khi người dùng bấm nút trên thông báo'
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: TURN_ON_BALCONY_LIGHTS
  action:
    - service: switch.turn_on
      continue_on_error: true
      target:
        entity_id:
          - switch.ban_cong_switch_1
          - switch.ban_cong_switch_2
    - service: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.camera_ban_cong_floodlight
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        message: "Đã bật sáng toàn bộ đèn và đèn pha ban công"
        data:
          tag: "balcony_status"
  mode: single

- id: 'living_notification_action_turn_on_lights'
  alias: 'Phòng Khách - Bật sáng đèn phòng khách từ thông báo'
  description: 'Bật toàn bộ đèn phòng khách khi người dùng bấm nút trên thông báo'
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: TURN_ON_LIVING_LIGHTS
  action:
    - service: switch.turn_on
      continue_on_error: true
      target:
        entity_id:
          - switch.phong_khach_switch_1
          - switch.phong_khach_switch_2
          - switch.phong_khach_switch_3
          - switch.phong_khach_switch_4
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        message: "Đã bật sáng đèn và quạt phòng khách"
        data:
          tag: "living_status"
  mode: single

# ─────────────────────────────────────────────────────────────────────────────
# NHÓM 5: CẢNH BÁO PIN YẾU CHO TOÀN BỘ THIẾT BỊ (< 20%)
# ─────────────────────────────────────────────────────────────────────────────
- id: 'low_battery_alert_all_devices'
  alias: 'Hệ Thống - Cảnh báo Pin Yếu cho Toàn Bộ Thiết Bị'
  description: 'Tự động kiểm tra mức pin của tất cả cảm biến và thiết bị trong nhà mỗi ngày lúc 09:00 sáng hoặc khi có pin giảm dưới 20%'
  trigger:
    - platform: time
      at: "09:00:00"
    - platform: numeric_state
      entity_id:
        - sensor.gate_sensor_battery
        - sensor.door_sensor_living_battery
        - sensor.door_sensor_office_battery
      below: 20
  condition:
    - condition: template
      value_template: >-
        {{ states.sensor 
          | selectattr('attributes.device_class', 'defined')
          | selectattr('attributes.device_class', 'eq', 'battery')
          | rejectattr('entity_id', 'search', 'pixel|ngan_cute|phone|tablet')
          | map(attribute='state')
          | map('float', 100)
          | select('lt', 20)
          | list | count > 0 }}
  action:
    - variables:
        low_batteries: >-
          {% set ns = namespace(items=[]) %}
          {% for s in states.sensor %}
            {% if s.attributes.device_class == 'battery' and not ('pixel' in s.entity_id or 'ngan_cute' in s.entity_id) %}
              {% set val = s.state | float(100) %}
              {% if val < 20 %}
                {% set ns.items = ns.items + [s.name ~ ' (' ~ val ~ '%)'] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.items | join(', ') }}
    - service: notify.mobile_app_pixel_10_pro_xl
      data:
        title: "🔋 CẢNH BÁO PIN YẾU THIẾT BỊ"
        message: "Các thiết bị thông minh sau đang yếu pin (< 20%): {{ low_batteries }}. Bạn hãy thay pin sớm để duy trì hoạt động liên tục."
        data:
          tag: "low_battery_warning"
          channel: "System_Alerts"
          clickAction: "/developer-tools/state"
  mode: single
