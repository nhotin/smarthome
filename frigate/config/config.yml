mqtt:
  host: 127.0.0.1
  port: 1883

database:
  path: /config/frigate.db

# ─── FFmpeg Hardware Acceleration (NVIDIA NVDEC / CUDA on RTX 3060) ──────────
ffmpeg:
  hwaccel_args: preset-nvidia-h264

# ─── Model Config (YOLOv8s 640x640 SOTA on RTX 3060 CUDA) ───────────────────
model:
  path: /config/model_cache/yolov8s.onnx
  width: 640
  height: 640
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  model_type: yolo-generic

# ─── Detector AI (ONNX CUDA on RTX 3060) ────────────────────────────────────
detectors:
  onnx:
    type: onnx
    device: AUTO

# ─── Phát hiện đối tượng & con vật ──────────────────────────────────────────
detect:
  enabled: true
  fps: 5

objects:
  track:
    - person
    - car
    - motorcycle
    - bicycle
    - dog
    - cat
  filters:
    person:
      min_score: 0.50
      threshold: 0.60
      min_area: 2000
    dog:
      min_score: 0.55
      threshold: 0.75
    cat:
      min_score: 0.55
      threshold: 0.75

# ─── Phân loại xem lại (Review) ──────────────────────────────────────────────
review:
  alerts:
    labels:
      - person
      - car
      - motorcycle
  detections:
    labels:
      - dog
      - cat
      - bicycle

# ─── Ghi hình liên tục 24/7 (Lưu trữ 30 ngày an toàn cho ổ cứng 1TB) ────────
record:
  enabled: true
  continuous:
    days: 30
  motion:
    days: 30
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

# ─── Ảnh chụp sự kiện ────────────────────────────────────────────────────────
snapshots:
  enabled: true
  retain:
    default: 30

# ─── go2rtc: lấy RTSP stream từ Tuya qua HA API ─────────────────────────────
go2rtc:
  streams:
    cong:
      - exec:/scripts/tuya_stream.sh cong {{output}}
    san_truoc:
      - exec:/scripts/tuya_stream.sh san_truoc {{output}}
    phong_khach:
      - exec:/scripts/tuya_stream.sh phong_khach {{output}}
    bep:
      - exec:/scripts/tuya_stream.sh bep {{output}}
    san_sau:
      - exec:/scripts/tuya_stream.sh san_sau {{output}}
    ban_cong:
      - exec:/scripts/tuya_stream.sh ban_cong {{output}}

# ─── Camera definitions ───────────────────────────────────────────────────────
cameras:
  cong:
    friendly_name: "Cổng"
    ui:
      order: 1
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cong
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 480
      height: 544
      fps: 5

  san_truoc:
    friendly_name: "Sân Trước"
    ui:
      order: 2
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/san_truoc
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5

  phong_khach:
    friendly_name: "Phòng Khách"
    ui:
      order: 3
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/phong_khach
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5

  bep:
    friendly_name: "Nhà Bếp"
    ui:
      order: 4
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/bep
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 640
      height: 720
      fps: 5

  san_sau:
    friendly_name: "Sân Sau"
    ui:
      order: 5
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/san_sau
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      filters:
        person:
          min_area: 2000
          threshold: 0.60
          mask:
            black_board:
              coordinates: "420,100,560,100,560,320,420,320"

  ban_cong:
    friendly_name: "Ban Công"
    ui:
      order: 6
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/ban_cong
          input_args: preset-rtsp-generic
          roles:
            - record
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5

version: 0.18-0
